services:
  portal:
    build: .
    container_name: pithagoras
    restart: unless-stopped
    network_mode: host
    volumes:
      - portal-data:/data
      # Certificates, when you have them. Empty by default.
      - ${PORTAL_TLS_DIR:-/dev/null}:/certs:ro
      # Workspaces pi works in. Read-write: the whole point is that it edits code.
      - ${WORKSPACES_DIR:-/root/repos}:/workspaces
      # Only needed when EXECUTOR=container.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # With host networking the portal binds PORT directly on the host.
      PORT: ${PORT:-4100}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:?set PORTAL_PASSWORD in .env}
      # Keeps logins valid across restarts; generate with: openssl rand -hex 32
      PORTAL_SECRET: ${PORTAL_SECRET:-}
      # host = pi runs in this container | container = one container per task
      EXECUTOR: ${EXECUTOR:-host}
      # Overrides only — left empty so pi's own settings.json (defaultProvider,
      # defaultModel) decides. Baking values in here made those unreachable.
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_MODEL: ${PI_MODEL:-}
      PI_THINKING_LEVEL: ${PI_THINKING_LEVEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Where the browser's web UI is, so the portal can link to it.
      BROWSER_HTTPS_PORT: ${BROWSER_HTTPS_PORT:-3011}
      # The portal proxies the browser's UI, so it holds that credential rather
      # than asking you for it a second time.
      BROWSER_USER: ${BROWSER_USER:-agent}
      BROWSER_PASSWORD: ${BROWSER_PASSWORD:-}
      # Serve the portal over TLS when both are given. Needed for the embedded
      # browser: the VNC client refuses to run unless every page above it is
      # secure.
      PORTAL_TLS_CERT: ${PORTAL_TLS_CERT:-}
      PORTAL_TLS_KEY: ${PORTAL_TLS_KEY:-}
      # Where a local llama.cpp server is listening. Host networking means the
      # box's own address works from inside the container unchanged.
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  # A real browser the agent can drive, with a profile that stays logged in.
  # Optional: see the profile below.
  #
  # Separate from the portal on purpose: the image is 4.6GB, and a browser that
  # crashes should not take the agent down with it. Host networking puts both on
  # the same 127.0.0.1, which is how the portal reaches the debugging port
  # without that port being reachable from anywhere else.
  browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: pithagoras-browser
    # Opt in, and nothing else changes if you do not. `docker compose up -d`
    # ignores this service entirely — no 4.6GB pull, no container, and the
    # portal hides its Browser page. Start it with:
    #   docker compose --profile browser up -d
    profiles: ["browser"]
    restart: unless-stopped
    network_mode: host
    # Chromium's own sandbox needs this; the alternative is --no-sandbox, which
    # is worse.
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"
    environment:
      PUID: ${BROWSER_UID:-0}
      PGID: ${BROWSER_GID:-0}
      TZ: ${TZ:-Etc/UTC}
      # The web UI you log in through. Not optional: this thing holds live
      # sessions for the agent's accounts.
      CUSTOM_USER: ${BROWSER_USER:-agent}
      PASSWORD: ${BROWSER_PASSWORD:?set BROWSER_PASSWORD in .env}
      CUSTOM_PORT: ${BROWSER_PORT:-3010}
      CUSTOM_HTTPS_PORT: ${BROWSER_HTTPS_PORT:-3011}
      # The agent attaches here. Chromium binds it to 127.0.0.1 by default and
      # it must stay that way — the port is unauthenticated, and whoever reaches
      # it owns every account the browser is signed into.
      CHROME_CLI: --remote-debugging-port=9222
    volumes:
      - browser-profile:/config
      # Restarts chromium when it exits; the image would otherwise leave the
      # container up with no browser in it.
      - ./browser/autostart:/defaults/autostart:ro

volumes:
  portal-data:
  browser-profile:
